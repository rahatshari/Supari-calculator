<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>সুপারি হিসাব অ্যাপ - কাঁচা-পাকা ও শুকনো সুপারি ক্যালকুলেটর</title>
  <meta name="description" content="কাঁচা-পাকা ও শুকনো সুপারি কেনা-বেচার সহজ, দ্রুত ও নির্ভুল হিসাব ক্যালকুলেটর">
  <meta property="og:title" content="সুপারি হিসাব অ্যাপ">
  <meta property="og:description" content="কাঁচা-পাকা ও শুকনো সুপারি কেনা-বেচার সহজ, দ্রুত ও নির্ভুল হিসাব ক্যালকুলেটর">
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="সুপারি হিসাব">
  
  <!-- Fonts & Local Libraries for 100% Offline Capability -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    // Self-healing: automatically clear any stuck service workers and stale caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var i = 0; i < regs.length; i++) {
          regs[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(keys) {
        for (var i = 0; i < keys.length; i++) {
          caches.delete(keys[i]);
        }
      });
    }

    function forceReload() {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
          });
        }
      } catch (e) {}
      window.location.reload(true);
    }
  </script>
</head>
<body>
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: 'Noto Sans Bengali', system-ui, sans-serif; text-align: center; padding: 20px; box-sizing: border-box;">
      <div style="width: 68px; height: 68px; margin-bottom: 14px; border-radius: 18px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06); border: 1.5px solid #e2e8f0;">
        <svg viewBox="0 0 120 120" width="50" height="50" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="loadShadow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(0,0,0,0.3)"/>
              <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
            </radialGradient>
            <radialGradient id="loadSupariBody" cx="40%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#f97316"/>
              <stop offset="50%" stop-color="#ea580c"/>
              <stop offset="85%" stop-color="#9a3412"/>
              <stop offset="100%" stop-color="#431407"/>
            </radialGradient>
            <linearGradient id="loadCalyxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#65a30d"/>
              <stop offset="100%" stop-color="#3f6212"/>
            </linearGradient>
          </defs>
          <ellipse cx="60" cy="100" rx="35" ry="12" fill="url(#loadShadow)"/>
          <path d="M 60 25 C 95 25, 100 60, 85 88 C 75 105, 45 105, 35 88 C 20 60, 25 25, 60 25 Z" fill="url(#loadSupariBody)"/>
          <path d="M 40 40 Q 32 65 42 90" stroke="#7c2d12" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round"/>
          <path d="M 80 40 Q 88 65 78 90" stroke="#7c2d12" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round"/>
          <path d="M 60 98 Q 65 70 60 30" stroke="#7c2d12" stroke-width="1.5" fill="none" opacity="0.3"/>
          <ellipse cx="45" cy="45" rx="8" ry="18" fill="#ffedd5" opacity="0.28" transform="rotate(-20 45 45)"/>
          <path d="M 45 28 C 48 20, 55 18, 60 18 C 65 18, 72 20, 75 28 C 78 32, 68 32, 60 34 C 52 32, 42 32, 45 28 Z" fill="url(#loadCalyxGrad)"/>
          <path d="M 40 25 C 45 25, 48 30, 52 28 C 48 35, 40 32, 40 25 Z" fill="url(#loadCalyxGrad)"/>
          <path d="M 80 25 C 75 25, 72 30, 68 28 C 72 35, 80 32, 80 25 Z" fill="url(#loadCalyxGrad)"/>
          <rect x="57" y="14" width="6" height="8" fill="#3f6212" rx="2"/>
        </svg>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
        <h2 style="margin: 0; color: #065f46; font-size: 19px; font-weight: 800;">সুপারি হিসাব</h2>
        <span style="font-size: 11px; background: #d1fae5; color: #047857; padding: 2px 7px; border-radius: 10px; font-weight: 800;">v২.০</span>
      </div>
      <p style="margin: 0 0 14px; color: #64748b; font-size: 13px; font-weight: 600;">লোড হচ্ছে, অপেক্ষা করুন...</p>
      
      <button
        type="button"
        onclick="forceReload()"
        style="background: #ffffff; color: #065f46; border: 1.5px solid #a7f3d0; padding: 8px 18px; border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.05);"
      >
        🔄 রিলোড / রিফ্রেশ করুন
      </button>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
