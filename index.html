<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>সুপারি হিসাব অ্যাপ</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0ea5e9;
      --success: #10b981;
      --success-hover: #059669;
      --bg-color: #f0fdfa;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; font-family: 'Noto Sans Bengali', sans-serif; }
    body { background-color: var(--bg-color); margin: 0; padding: 20px 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overscroll-behavior: none; }
    
    .app-container { width: 100%; max-width: 400px; background: var(--card-bg); padding: 35px 20px; border-radius: 20px; box-shadow: 0 10px 40px -10px rgba(16, 185, 129, 0.15); text-align: center; }
    
    .logo-container svg { width: 80px; height: 80px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); margin-bottom: 10px; }
    h2 { color: var(--success-hover); margin: 0 0 5px 0; font-size: 24px; font-weight: 700; }
    p.subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 30px; }
    
    /* মেনু বাটন ডিজাইন */
    .menu-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 18px; margin-bottom: 18px; background: linear-gradient(135deg, #f8fafc, #f1f5f9); border: 2px solid #e2e8f0; border-radius: 15px; text-decoration: none; color: var(--text-main); font-size: 18px; font-weight: 700; transition: all 0.3s ease; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .menu-btn:hover, .menu-btn:active { border-color: var(--success); background: #ecfdf5; transform: translateY(-2px); box-shadow: 0 8px 12px -2px rgba(16, 185, 129, 0.15); }
    
    .icon-svg { width: 32px; height: 32px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15)); }
    
    .footer { margin-top: 35px; font-size: 14px; color: var(--text-muted); border-top: 1px dashed #cbd5e1; padding-top: 15px;}
    .footer a { color: var(--success-hover); text-decoration: none; font-weight: bold; transition: 0.2s;}
    .footer a:hover { color: #047857; text-decoration: underline; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- মূল লোগো -->
  <div class="logo-container">
    <img src="icon.svg" alt="Logo" width="80" height="80">
  </div>
  
  <h2>সুপারি হিসাব অ্যাপ</h2>
  <p class="subtitle">আপনি কোন হিসাবটি করতে চান নির্বাচন করুন</p>

  <!-- কাঁচা-পাকা সুপারি বাটন -->
  <a href="kacha-paka.html" class="menu-btn">
    <!-- কাঁচা-পাকা সুপারির আইকন (সবুজ-কমলা) -->
    <svg class="icon-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="rawGrad" cx="35%" cy="35%" r="65%">
          <stop offset="0%" stop-color="#f59e0b"/> <!-- পাকা কমলা রঙ -->
          <stop offset="50%" stop-color="#ea580c"/>
          <stop offset="100%" stop-color="#15803d"/> <!-- কাঁচা সবুজ রঙ -->
        </radialGradient>
      </defs>
      <path d="M50 15 C80 15, 85 50, 70 80 C60 95, 40 95, 30 80 C15 50, 20 15, 50 15 Z" fill="url(#rawGrad)"/>
      <path d="M45 18 C48 10, 52 10, 55 18 Z" fill="#166534"/> <!-- বোঁটা -->
      <ellipse cx="40" cy="35" rx="6" ry="12" fill="#ffedd5" opacity="0.3" transform="rotate(-20 40 35)"/> <!-- গ্লোস -->
    </svg>
    কাঁচা-পাকা সুপারি
  </a>

  <!-- শুকনো সুপারি বাটন -->
  <a href="shukno.html" class="menu-btn">
    <!-- শুকনো সুপারির আইকন (খয়েরি কুঁচকানো) -->
    <svg class="icon-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="dryGrad" cx="40%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#9a3412"/> <!-- হালকা খয়েরি -->
          <stop offset="60%" stop-color="#78350f"/>
          <stop offset="100%" stop-color="#451a03"/> <!-- গাঢ় খয়েরি -->
        </radialGradient>
      </defs>
      <path d="M50 18 C85 18, 80 55, 65 82 C55 95, 45 95, 35 82 C20 55, 15 18, 50 18 Z" fill="url(#dryGrad)"/>
      <!-- শুকনো সুপারির গায়ের দাগ বা টেক্সচার -->
      <path d="M35 30 Q40 55 32 78 M65 30 Q60 55 68 78 M50 25 Q55 55 48 82 M42 28 Q48 50 40 80 M58 28 Q52 50 60 80" stroke="#280f02" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
      <path d="M45 18 C48 12, 52 12, 55 18 Z" fill="#3f1e04"/> <!-- শুকনো বোঁটা -->
    </svg>
    শুকনো সুপারি হিসাব
  </a>

  <div class="footer">
    Created by <a href="https://www.facebook.com/rahatsharif504" target="_blank">Rahat Sharif</a>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>
</body>
</html>
