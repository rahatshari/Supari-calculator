<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- ছায়া (Drop Shadow) -->
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    
    <!-- সুপারির অরিজিনাল কালার (Orange to Dark Brown) -->
    <radialGradient id="supari-body" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f97316"/> <!-- উজ্জ্বল কমলা -->
      <stop offset="50%" stop-color="#ea580c"/> <!-- লালচে কমলা -->
      <stop offset="85%" stop-color="#9a3412"/> <!-- গাঢ় লাল-খয়েরি -->
      <stop offset="100%" stop-color="#431407"/>
    </radialGradient>
    
    <!-- সুপারির বোঁটার কালার -->
    <linearGradient id="calyx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </linearGradient>
  </defs>

  <!-- নিচের ছায়া -->
  <ellipse cx="60" cy="100" rx="35" ry="12" fill="url(#shadow)"/>

  <!-- সুপারির মূল বডি (ডিম্বাকৃতি/কোণাকার) -->
  <path d="M 60 25 C 95 25, 100 60, 85 88 C 75 105, 45 105, 35 88 C 20 60, 25 25, 60 25 Z" fill="url(#supari-body)"/>

  <!-- সুপারির গায়ের দাগ বা টেক্সচার -->
  <path d="M 40 40 Q 32 65 42 90" stroke="#7c2d12" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 80 40 Q 88 65 78 90" stroke="#7c2d12" stroke-width="2.5" fill="none" opacity="0.4" stroke-linecap="round"/>
  <path d="M 60 98 Q 65 70 60 30" stroke="#7c2d12" stroke-width="1.5" fill="none" opacity="0.3"/>
  <path d="M 50 35 Q 45 60 52 95" stroke="#7c2d12" stroke-width="1.5" fill="none" opacity="0.25"/>
  <path d="M 70 35 Q 75 60 68 95" stroke="#7c2d12" stroke-width="1.5" fill="none" opacity="0.25"/>

  <!-- গ্লোসি হাইলাইট (আলোর প্রতিফলন) -->
  <ellipse cx="45" cy="45" rx="8" ry="18" fill="#ffedd5" opacity="0.25" transform="rotate(-20 45 45)"/>

  <!-- বোঁটা বা ক্যাপ (Calyx) -->
  <path d="M 45 28 C 48 20, 55 18, 60 18 C 65 18, 72 20, 75 28 C 78 32, 68 32, 60 34 C 52 32, 42 32, 45 28 Z" fill="url(#calyx-grad)"/>
  <path d="M 40 25 C 45 25, 48 30, 52 28 C 48 35, 40 32, 40 25 Z" fill="url(#calyx-grad)"/>
  <path d="M 80 25 C 75 25, 72 30, 68 28 C 72 35, 80 32, 80 25 Z" fill="url(#calyx-grad)"/>
  
  <!-- ছোট ডাল -->
  <rect x="57" y="14" width="6" height="8" fill="#3f6212" rx="2"/>
</svg>
