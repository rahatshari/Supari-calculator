name: Build Offline Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Offline Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm install

      - name: 🔨 Build 100% Offline Web Bundle
        run: npm run build

      - name: 📱 Generate Capacitor Android Native Project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/configure-android.js

      - name: ⚙️ Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📋 Prepare APK for Download
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/supari-calculator-offline.apk

      - name: 🚀 Upload APK Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: supari-calculator-offline-apk
          path: output-apk/supari-calculator-offline.apk
          retention-days: 30

      - name: 🏷️ Get Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: 🚀 Publish APK to GitHub Releases (Automatic)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.tag }}
          name: "সুপারি হিসাব অফলাইন অ্যাপ (APK v${{ steps.pkg_version.outputs.version }})"
          body: |
            ## 🎉 সুপারি হিসাব অফলাইন অ্যান্ড্রয়েড অ্যাপ (APK ভার্সন ${{ steps.pkg_version.outputs.version }})
            
            - ⚡ **অটোমেটিক ইন-অ্যাপ আপডেট ও ইনস্টল সুবিধা**
            - 🖼️ **সরাসরি ডিভাইসে JPG মেমো রসিদ সেভ ও শেয়ার**
            - 🔒 **স্থায়ী সিকিউর সাইনিং (সেম সিগনেচার কনফ্লিক্ট মুক্ত)**
            - 🚀 **কোনো লোডিং স্ক্রিন ছাড়াই তাৎক্ষণিক অ্যাপ চালু**
            
            **ডাউনলোড লিংক:** নিচের `supari-calculator-offline.apk` ফাইলে ক্লিক করে ডাউনলোড ও ইনস্টল করুন।
          files: output-apk/supari-calculator-offline.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
