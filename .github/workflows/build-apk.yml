name: Build Native Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Native Kotlin Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 📜 Accept Android SDK Licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: 🏷️ Read Version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: ⚙️ Build Signed Native Release APK
        run: gradle -p kotlin-android assembleRelease --no-daemon

      - name: 📋 Prepare APK for Download
        run: |
          mkdir -p output-apk
          cp kotlin-android/app/build/outputs/apk/release/app-release.apk output-apk/supari-calculator-offline.apk
          ls -lh output-apk/supari-calculator-offline.apk

      - name: 🚀 Upload APK Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: supari-calculator-offline-apk
          path: output-apk/supari-calculator-offline.apk
          retention-days: 30

      - name: 🚀 Publish APK to GitHub Releases (Automatic)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.tag }}
          name: "সুপারি হিসাব নেটিভ অ্যান্ড্রয়েড অ্যাপ (APK v${{ steps.pkg_version.outputs.version }})"
          body: |
            ## 🚀 সুপারি হিসাব নেটিভ অ্যান্ড্রয়েড অ্যাপ (APK ভার্সন ${{ steps.pkg_version.outputs.version }})

            - ⚡ **জিরো-ডিলে তাৎক্ষণিক ওপেন:** কোনো স্প্ল্যাশ স্ক্রিন বা ওয়েবভিউ ছাড়াই ~১০০-২০০ মিলিসেকেন্ডে সরাসরি অ্যাপ ওপেন হয়!
            - 🧮 **১০০% নেটিভ Jetpack Compose UI:** একদম ফোনের নিজস্ব ক্যালকুলেটরের মতো দ্রুত ও স্মুথ পারফরম্যান্স।
            - 🖼️ **১-ক্লিক সরাসরি JPG মেমো সেভ:** কোনো অতিরিক্ত পপআপ বা ফাইল ম্যানেজার ছাড়াই সরাসরি গ্যালারিতে (`Pictures/SupariCalculator`) সেভ হয়।
            - 🔄 **ইন-অ্যাপ অটো আপডেট:** নতুন আপডেট আসলে স্বয়ংক্রিয়ভাবে নোটিফিকেশন ও ইনস্টল সুবিধা।
            - 🔒 **স্থায়ী সিগনেচার (`supari.keystore`):** আগের ভার্সন আনইনস্টল না করেই সরাসরি আপডেট করা যাবে।

            **ডাউনলোড লিংক:** নিচের `supari-calculator-offline.apk` ফাইলে ক্লিক করে ডাউনলোড ও ইনস্টল করুন।
          files: output-apk/supari-calculator-offline.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
