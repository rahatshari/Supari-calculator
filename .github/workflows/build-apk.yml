name: Build Offline Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Generate Offline Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install npm dependencies
        run: npm install

      - name: 🔨 Build 100% Offline Web Bundle
        run: npm run build

      - name: 📱 Generate Capacitor Android Native Project
        run: |
          npx cap add android
          npx cap sync android
          # Replace icons for specific density folders only (avoiding anydpi-v26 XML duplicate resource conflict)
          for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            dir="android/app/src/main/res/mipmap-$dpi"
            if [ -d "$dir" ]; then
              cp public/pwa-192x192.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp public/pwa-192x192.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp public/pwa-512x512.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            fi
          done
          # Ensure anydpi-v26 only keeps XML adaptive icons
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.png 2>/dev/null || true
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.png 2>/dev/null || true

          # Remove splash screen images and make them blank matching app background #f8fafc
          cp public/splash.png android/app/src/main/res/drawable/splash.png 2>/dev/null || true
          for dir in android/app/src/main/res/drawable-port-*; do
            if [ -d "$dir" ]; then
              cp public/splash.png "$dir/splash.png" 2>/dev/null || true
            fi
          done
          for dir in android/app/src/main/res/drawable-land-*; do
            if [ -d "$dir" ]; then
              cp public/splash-land.png "$dir/splash.png" 2>/dev/null || true
            fi
          done

          # Disable Android launch splash theme completely so app opens directly to home view
          sed -i 's|<item name="android:background">@drawable/splash</item>|<item name="android:background">#f8fafc</item>|g' android/app/src/main/res/values/styles.xml 2>/dev/null || true
          sed -i 's|android:theme="@style/AppTheme.NoActionBarLaunch"|android:theme="@style/AppTheme.NoActionBar"|g' android/app/src/main/AndroidManifest.xml 2>/dev/null || true

          # Set official Android APK Version 2.0 (versionCode 2, versionName "2.0")
          sed -i 's/versionCode [0-9]*/versionCode 2/g' android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "2.0"/g' android/app/build.gradle

      - name: ⚙️ Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📋 Prepare APK for Download
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/supari-calculator-offline.apk

      - name: 🚀 Upload APK Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: supari-calculator-offline-apk
          path: output-apk/supari-calculator-offline.apk
          retention-days: 30

      - name: 🏷️ Publish APK to GitHub Releases (Automatic)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2.0.0-apk' }}
          name: "সুপারি হিসাব অফলাইন অ্যাপ (APK ${{ github.ref_name || 'v2.0.0' }})"
          body: "কাঁচা-পাকা ও শুকনো সুপারি হিসাবের ১০০% অফলাইন অ্যান্ড্রয়েড অ্যাপ (APK ভার্সন ২.০)।"
          files: output-apk/supari-calculator-offline.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
